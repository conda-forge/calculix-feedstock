schema_version: 1

context:
  name: calculix
  version: "2.24"
  sha256: 99fb4f9b0ec19b100a914c3a097ea1e7f0c22f715b96338acc4a66b63306a2e2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: http://www.dhondt.de/ccx_${{ version }}.src.tar.bz2
  sha256: ${{ sha256 }}
  patches:
    - patches/avoid-ifport.patch
    # 2.24 moved the sources from ccx_2.23/ to ccx_2.24/, so every patch
    # below was regenerated against the new tree.  The fixes that were taken
    # upstream are no longer carried: they are in 2.24 itself.
    #
    # still submitted upstream, not in 2.24
    - patches/upstream-mohrcoulomb-degenerate-return.patch
    - patches/upstream-readfrd-return-value.patch
    # 2.23 creates and joins threads for every loop of every *CFD iteration,
    # so small meshes run several times slower threaded than on one core
    - patches/fix-cfd-small-mesh-threads.patch
    # a rotational SPC or moment on a plane stress, plane strain or
    # axisymmetric node reaches the mean rotation code, which sets its loop
    # bounds only for shells and beams; FreeCAD/FreeCAD#10865
    - patches/fix-2d-rotational-dofs.patch
    # found by AddressSanitizer and by poisoning uninitialised memory over
    # CalculiX's suite and FreeCAD's FEM test models
    - patches/fix-cd-lab-correction-edges.patch
    # calls whose arguments do not line up with the routine called, found by
    # checking every call against its callee
    - patches/fix-flux-rcavi-physcon.patch
    # face-to-face contact with PRESSURE-OVERCLOSURE=TABULAR used the old
    # 82-entry layout of plconloc that materialdata_sp.f no longer fills
    - patches/fix-f2f-tabular-overclosure.patch
    # found by AddressSanitizer on FreeCAD's ccx_1D_fluid_network example
    - patches/fix-preinitialnet-inlet-neighbor.patch
    # crashes, hangs and silent out-of-bounds accesses on malformed input,
    # found by fuzzing 518 decks under AddressSanitizer; each such input now
    # ends in an *ERROR and exit code 201
    - patches/fix-malformed-input-nodes-elements.patch
    - patches/fix-malformed-input-sets-sections.patch
    - patches/fix-malformed-input-fluid.patch
    - patches/fix-malformed-input-materials.patch
    - patches/fix-malformed-input-parsing.patch
    # two fluid network loops that test the wrong element; these change
    # results for valid models
    - patches/fix-fluid-network-labels.patch
    - patches/fix-malformed-input-misc.patch
    - patches/fix-malformed-input-followups.patch
    # mingw has no clock_gettime and the timing print was already disabled
    # on Windows and macOS before 2.24; keep it that way
    - if: win or osx
      then: patches/mingw_time.patch

build:
  number: 0

requirements:
  build:
    - make
    - perl
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - ${{ compiler("fortran") }}
    - if: win
      then:
        - ${{ compiler('m2w64_c') }}
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_fortran') }}
    - if: osx
      then:
        - llvm-openmp
  host:
    - libblas
    - liblapack
    - arpack
    # spoolesMT.a is linked statically and its data races were only fixed in
    # build 1006, so an older build bakes silently wrong threaded results into
    # ccx with nothing at run time to express the constraint; see Makefile_MT
    - spooles[version ='>=2.2',build_number='>=1006']
    - if: osx
      then:
        - llvm-openmp
  run:
    - arpack
    - if: osx
      then:
        - llvm-openmp

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/bin/ccx
      - if: win
        then: if not exist %LIBRARY_PREFIX%\bin\ccx.exe exit 1
  # a build that links but miscomputes has shipped from here before, so
  # actually solve something and check the numbers
  - script: python run_test.py
    files:
      recipe:
        - run_test.py
        - smoketest.inp
        - contact.inp
        - contact.dat.ref
        - mohr.inp
        - restart.inp
        - cfd.inp
        - cfd.dat.ref
        - axirot.inp
        - axirotload.inp
        - hcfnoinput.inp
        - bleedtap.inp
    requirements:
      run:
        - python

about:
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: 3D Structural Finite Element Program
  description: A Free Software Three-Dimensional Structural Finite Element Program
  homepage: https://www.dhondt.de/
  repository: https://github.com/Dhondtguido/CalculiX
  documentation: https://www.dhondt.de/ccx_${{ version }}.pdf

extra:
  recipe-maintainers:
    - oursland
    - looooo
    - Krande
